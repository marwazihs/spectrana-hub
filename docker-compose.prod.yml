# Production stack for Dokploy (Docker Compose mode, NOT Stack — we use `build:`).
#
# Tracker, decisions, and runbook: docs/operations/dokploy-deploy.md
# Env var template:                .env.dokploy.example
#
# Services:
#   - spectrana-minio  S3-compatible object store (named volume)
#   - bucket-init      one-shot: create the bucket if missing
#   - migrate          one-shot: alembic upgrade head
#   - hub              FastAPI :8000 — domains reports.<domain> and <domain>/api (strip path)
#   - frontend         Next.js :3000 — domain <domain>
#
# Postgres is a Dokploy-managed database in the same project (DATABASE_URL).
#
# Dokploy rules this file follows (docs.dokploy.com/docs/core/docker-compose):
#   - No `ports:` — Traefik reaches services over Docker networks; the
#     Domains tab (service + container port) injects the router labels.
#   - No `container_name`.
#   - UI env vars land in `.env` but are NOT injected into containers, so
#     every value is referenced explicitly as ${VAR}. `:?` fails the deploy
#     on a missing secret instead of starting insecure.
#   - Named volumes persist across redeploys and support Volume Backups.
#
# Networks: enable "Isolated Deployments" in Dokploy. `hub` and `migrate`
# additionally join `dokploy-network` to reach the managed Postgres. MinIO
# is deliberately NOT on it, and is named `spectrana-minio` so its DNS name
# can't collide with another project's `minio` on the shared network.

x-internal-token: &internal-token
  HUB_INTERNAL_TOKEN: ${HUB_INTERNAL_TOKEN:?set HUB_INTERNAL_TOKEN (>=32 bytes)}

x-minio-image: &minio-image
  # Docker Hub `minio/minio` and `minio/mc` are no longer pullable. Official
  # images remain on quay.io (frozen at this release). Pinned so a redeploy
  # never changes the storage binary underneath us.
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z

services:
  spectrana-minio:
    <<: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (>=8 chars)}
    volumes:
      - hub_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket if missing (idempotent). Reuses the MinIO
  # image, which ships `mc`, so there's no second image to pull.
  bucket-init:
    <<: *minio-image
    depends_on:
      spectrana-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-hub-reports-prod}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://spectrana-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_S3_BUCKET"
    restart: "no"

  # One-shot: alembic upgrade head. hub waits for exit 0. Note: a failure
  # here does NOT fail the Dokploy deploy — hub just never starts. Check
  # this service's logs first when the domain 404s/502s after a deploy.
  migrate:
    build: .
    image: spectrana-hub-api:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (postgresql+asyncpg://...)}
    networks:
      - default
      - dokploy-network
    restart: "no"

  hub:
    # Same Dockerfile + tag as `migrate`. `build:` is repeated (not just
    # `image:`) so compose never tries to *pull* this local-only tag on a
    # first deploy; the second build is a full cache hit.
    build: .
    image: spectrana-hub-api:latest
    environment:
      <<: *internal-token
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (postgresql+asyncpg://...)}
      AWS_S3_ENDPOINT_URL: http://spectrana-minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-hub-reports-prod}
      AWS_REGION: us-east-1
      # Bare hostnames, no scheme/port. The /render Host guard and CSP
      # frame-ancestors compare against these exactly.
      HUB_PRIMARY_DOMAIN: ${HUB_PRIMARY_DOMAIN:?set HUB_PRIMARY_DOMAIN (e.g. hub.majie.ai)}
      HUB_REPORTS_DOMAIN: ${HUB_REPORTS_DOMAIN:?set HUB_REPORTS_DOMAIN (e.g. reports.hub.majie.ai)}
      HUB_URL_SCHEME: https
      HUB_EMAIL_FROM: ${HUB_EMAIL_FROM:?set HUB_EMAIL_FROM}
      HUB_EMAIL_BRAND_NAME: ${HUB_EMAIL_BRAND_NAME:?set HUB_EMAIL_BRAND_NAME}
      HUB_SESSION_SECRET: ${HUB_SESSION_SECRET:?set HUB_SESSION_SECRET (>=32 bytes)}
      HUB_IFRAME_JWT_SECRET: ${HUB_IFRAME_JWT_SECRET:?set HUB_IFRAME_JWT_SECRET (>=32 bytes)}
      HUB_MAGIC_LINK_HASH_SECRET: ${HUB_MAGIC_LINK_HASH_SECRET:?set HUB_MAGIC_LINK_HASH_SECRET (>=32 bytes)}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      spectrana-minio:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network
    # Single replica: APScheduler's nightly sweep runs in-process.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Baked at `next build`. Changing the reports domain needs a rebuild
        # (a normal Dokploy redeploy rebuilds).
        NEXT_PUBLIC_HUB_REPORTS_DOMAIN: ${HUB_REPORTS_DOMAIN:?set HUB_REPORTS_DOMAIN}
    environment:
      <<: *internal-token
      # Server-side Next.js → Hub over the compose network; never reaches
      # the browser. HUB_COOKIE_SECURE is intentionally unset → Secure
      # cookies and https iframe src.
      HUB_API_BASE_URL: http://hub:8000
    depends_on:
      hub:
        condition: service_started
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  hub_minio_data:
